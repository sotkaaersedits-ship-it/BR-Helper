
name: Build BR Helper APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BR_Helper_Android_Project.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip BR_Helper_Android_Project.zip -d .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle -p BR_Helper assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BR-Helper-APK
          path: BR_Helper/app/build/outputs/apk/debug/app-debug.apk
          
